## Settings file was created by plugin Valheim Enhanced Edition v1.1.1
## Plugin GUID: com.chase.valheimenhancededition

[Debug views]

## A key that steps through the colour views of what the mod draws (pieces, merged cells, far view tiers, far view detail levels, far trees; then off), with a legend on screen. Unset by default; F7 is free in the vanilla game. The same views from the console: perf viz pieces|cells|far|lod|foliage|off.
# Setting type: KeyboardShortcut
# Default value:
CycleKey =

[Far builds]

## EXPERIMENTAL, single player and host only: keep a simplified copy of your merged buildings on disk and draw it beyond the distance where the game unloads the real pieces, so bases stay in view from far away. Changes what you see at a distance, so it is off by default. Needs merged buildings on.
# Setting type: Boolean
# Default value: false
Enabled = true

## Single player / host: also build far copies of builds you haven't visited this session, from the world's saved records (nearest first, within Distance).
# Setting type: Boolean
# Default value: true
WholeWorld = true

## Single player / host: show flattened, raised, dug and paved ground in the game's distant terrain too (it normally shows the untouched ground there). Left to RenderHeim's far terrain when that is installed.
# Setting type: Boolean
# Default value: true
TerrainEdits = true

## Single player / host: also show trees and big rocks beyond the game's range (from the world's saved objects, in areas that have been generated), wind sway held still.
# Setting type: Boolean
# Default value: true
Foliage = true

## How far away (metres) the far copies are drawn.
# Setting type: Single
# Default value: 2000
Distance = 4000

## On a server (dedicated or hosting): send the piece lists of distant bases to players who have this mod with far view on, so far view works for them too. Costs a scan of the world's pieces every 20 s while someone uses it, and a little bandwidth.
# Setting type: Boolean
# Default value: true
ServeClients = true

## Playing on a server without this mod: keep far copies of the bases you pass, and draw those (bases you never came near can't be shown). With the mod on the server, far view gets every base from it instead.
# Setting type: Boolean
# Default value: false
VisitedOnServers = false

## Write where far view's graphics memory goes to the log every 10 s (a short hitch each time on a big world). For diagnosing only.
# Setting type: Boolean
# Default value: false
LogMemory = false

## How much far view takes on. Auto picks by the PC (graphics card memory, processor threads, free memory; the choice is in the log). Low: builds out to 1.5 km, coarse beyond 600 m, 1 cell and 2 chunk builders, far meshes up to 512 MB of what the graphics card has free. Medium: 3 km, coarse beyond 1 km, up to 1.5 GB. High: full reach (with FarLands up to 6 km), coarse beyond 1.5 km, up to 6 GB. The reach cap applies only while Distance is left at its default.
# Setting type: FarPreset
# Default value: Auto
# Acceptable values: Auto, Low, Medium, High
Preset = Auto

## How the distant levels of far chunks are simplified. Quadric (default): edges collapsed by their error, under 3/4 of a pixel where each level is drawn (far fewer triangles and less graphics memory for the same look; a new chunk shows a quick Cluster copy first and is refined in the background, at low priority). Cluster: vertices snapped to a grid (as in 1.0.1). Chunks are built again on a change; also 'perf simplifier cluster|quadric'.
# Setting type: FarSimplifier
# Default value: Quadric
# Acceptable values: Cluster, Quadric
Simplifier = Quadric

[Merged buildings]

## Draw the plain pieces of your buildings as one mesh per material per area (CellSize), instead of one object per piece.
# Setting type: Boolean
# Default value: true
Enabled = true

## Most time a frame may spend building the merged meshes (milliseconds).
# Setting type: Single
# Default value: 2
FrameBudgetMs = 2

## Most time a frame may spend on them while the loading screen is fully up (teleports, portals), so the destination is merged by the time it shows. Set it to FrameBudgetMs or lower to turn this off.
# Setting type: Single
# Default value: 8
LoadingBudgetMs = 8

## Size of the square areas merged into one mesh (metres): bigger means fewer draw calls but more drawn off-screen.
# Setting type: Int32
# Default value: 32
# Acceptable values: 16, 32, 64
CellSize = 32

## How a piece is taken out of its merged mesh for a moment (hover highlight, destroyed, damaged) without rebuilding the area. Full (default): the area's whole index list is sent to the graphics card again, which every card and driver takes. Partial: only the piece's part is sent (as up to 1.1.0; on some older cards a neighbouring piece goes missing for about a second). Rebuild: the area is rebuilt instead (slowest).
# Setting type: IndexWrites
# Default value: Full
# Acceptable values: Full, Partial, Rebuild
IndexWrites = Full

[Object streaming]

## Skip the 30-per-second check for objects to create or remove when nothing it looks at has changed.
# Setting type: Boolean
# Default value: true
SkipIdleChecks = true

[Terrain]

## Keep more finished terrain builds, so a zone's terrain isn't thrown away just before it's needed (multi-second stalls).
# Setting type: Boolean
# Default value: true
BiggerBuildCache = true

[Tune]

## What 'perf tune' found and chose last (written by the command).
# Setting type: String
# Default value:
LastResult =

[Water]

## Update each water surface's animation time without asking Unity for its material every frame.
# Setting type: Boolean
# Default value: true
CacheMaterials = true

## Work out the water height under floating things (boats, items, swimmers) with the wind and the water volume's size looked up once per frame instead of once per object. The heights are exactly the game's.
# Setting type: Boolean
# Default value: true
FastFloaters = true

[Zones]

## Find out whether a zone still holds objects by zone, not by asking every object where it is.
# Setting type: Boolean
# Default value: true
FastUnloadCheck = true
